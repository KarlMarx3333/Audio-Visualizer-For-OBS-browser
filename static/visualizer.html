<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ObsVizHost Visualizer</title>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>
    body { overflow: hidden; }
    html.embed, body.embed { background: transparent !important; }
    body.embed #wrap, body.embed #stage { background: transparent !important; }
    body.embed #canvas { background: transparent !important; }
    #wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; background: transparent; }
    #topbar { padding: 10px 12px; background: rgba(18,24,36,0.85); border-bottom: 1px solid rgba(255,255,255,0.06); }
    #topbar.hidden { display: none; }
    #stage { display: flex; align-items: center; justify-content: center; background: transparent; width: 100%; height: 100%; }
    #canvas { display: block; background: transparent; }
    #meta { font-size: 12px; color: #9fb0c8; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
    #meta b { color: #e6eefc; }
    #vizErrorPanel {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10000;
      max-width: min(520px, 95vw);
      max-height: 80vh;
      overflow: auto;
      background: rgba(16, 20, 28, 0.94);
      color: #e9f0ff;
      border: 1px solid rgba(255, 100, 100, 0.6);
      border-left: 4px solid #ff6b6b;
      border-radius: 8px;
      padding: 10px 12px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      display: none;
    }
    #vizErrorPanel.visible { display: block; }
    #vizErrorPanel .title { font-weight: 700; margin-bottom: 6px; color: #ffd7d7; }
    #vizErrorPanel .label { display: block; margin-top: 6px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #9fb0c8; }
    #vizErrorPanel pre { margin: 4px 0 0; white-space: pre-wrap; }
    #vizErrorPanel .switch { margin-top: 8px; color: #ffe2a8; font-weight: 600; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="topbar">
      <div class="row" style="align-items:flex-end;">
        <div class="col" style="min-width:220px">
          <label>Visualizer</label>
          <select id="vizSel"></select>
        </div>
        <div class="col" style="min-width:220px">
          <label>Gain (tray)</label>
          <input id="gain" type="range" min="0.2" max="4.0" step="0.01" value="1.0" disabled/>
        </div>
        <div class="col" style="min-width:220px">
          <label>Smoothing (tray)</label>
          <input id="vsmooth" type="range" min="0" max="0.95" step="0.01" value="0.55" disabled/>
        </div>
        <div class="col" style="min-width:220px">
          <label>&nbsp;</label>
          <button id="fit">Fit</button>
        </div>
      </div>
      <div style="height:10px"></div>
      <div id="meta"></div>
    </div>
    <div id="stage">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <div id="vizErrorPanel" role="status" aria-live="polite">
    <div class="title">Visualizer Error</div>
    <div class="label">Visualizer</div>
    <div id="vizErrorViz"></div>
    <div class="label">Message</div>
    <pre id="vizErrorMsg"></pre>
    <div class="label" id="vizErrorStackLabel">Stack</div>
    <pre id="vizErrorStack"></pre>
    <div class="label">Time</div>
    <div id="vizErrorTime"></div>
    <div class="switch" id="vizErrorSwitch">Switched to Safe Mode</div>
  </div>

<script type="module">
import { connectAudioWS } from "/static/js/ws_client.js";
import { registry, createVisualizer } from "/static/js/visualizers/registry.js";

const SAFE_VIZ_ID = "safe_canvas2d";

const qs = new URLSearchParams(location.search);
const embed = qs.get("embed") === "1";
const debug = qs.get("debug") === "1";


const topbar = document.getElementById("topbar");
if(embed){
  topbar.classList.add("hidden");
  document.documentElement.classList.add("embed");
  document.body.classList.add("embed");
}

let canvas = document.getElementById("canvas");
const wrap = document.getElementById("wrap");
const vizSel = document.getElementById("vizSel");
const gainEl = document.getElementById("gain");
const vsmoothEl = document.getElementById("vsmooth");
const meta = document.getElementById("meta");
const vizErrorPanel = document.getElementById("vizErrorPanel");
const vizErrorViz = document.getElementById("vizErrorViz");
const vizErrorMsg = document.getElementById("vizErrorMsg");
const vizErrorStack = document.getElementById("vizErrorStack");
const vizErrorStackLabel = document.getElementById("vizErrorStackLabel");
const vizErrorTime = document.getElementById("vizErrorTime");
const vizErrorSwitch = document.getElementById("vizErrorSwitch");

function currentVizFromPath(){
  const parts = location.pathname.split("/");
  const name = parts[parts.length-1] || SAFE_VIZ_ID;
  return name;
}

const fixedViz = qs.get("viz") || (location.pathname.startsWith("/v/") ? currentVizFromPath() : null);
const followServer = fixedViz == null;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  const wrapRect = wrap.getBoundingClientRect();
  let availW = wrapRect.width;
  let availH = wrapRect.height;
  if(!embed){
    const topRect = topbar.getBoundingClientRect();
    availH = Math.max(0, availH - topRect.height);
  }
  // Default: UI view = 0.8, OBS embed = 1.0 (fills source).
  // Optional override: ?scale=0.8 (only if explicitly provided)
  const scaleStr = qs.get("scale");
  let scale;
  if(scaleStr !== null && scaleStr !== ""){
    const s = parseFloat(scaleStr);
    if(Number.isFinite(s)){
      scale = Math.max(0.1, Math.min(1.0, s));
    }else{
      scale = embed ? 1.0 : 0.8;
    }
  }else{
    scale = embed ? 1.0 : 0.8;
  }
  const cssW = Math.max(2, Math.floor(availW * scale));
  const cssH = Math.max(2, Math.floor(availH * scale));
  canvas.style.width = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width = Math.max(2, Math.floor(cssW * dpr));
  canvas.height = Math.max(2, Math.floor(cssH * dpr));
  if(viz && viz.onResize) viz.onResize(cssW, cssH, dpr);
}
window.addEventListener("resize", resize);
document.getElementById("fit").addEventListener("click", resize);

await registry.ensureLoaded();

for(const v of registry.list()){
  vizSel.appendChild(new Option(v.name + " ("+v.renderer+")", v.id));
}

let vizName = fixedViz || SAFE_VIZ_ID;
if(!registry.get(vizName)) vizName = SAFE_VIZ_ID;

let currentRenderer = (registry.get(vizName)?.renderer ?? "2d");

function replaceCanvas(){
  const old = canvas;
  const nu = old.cloneNode(false);
  old.replaceWith(nu);
  canvas = nu;
}

let viz = null;
let latestFrame = null;
let lastState = { samplerate: 48000, fft_size: 2048 };
let vizError = null;
const mutationLogged = new Set();
// Always-on error badge (visible in embed too).
const debugBadge = document.createElement("div");
debugBadge.style.cssText = debug
  ? "position:fixed;right:8px;bottom:8px;z-index:9999;background:rgba(200,40,40,0.92);color:#fff;padding:4px 6px;border-radius:4px;font:11px/1.2 sans-serif;pointer-events:none;display:none;"
  : "position:fixed;right:8px;bottom:8px;z-index:9999;background:rgba(200,40,40,0.78);color:#fff;padding:2px 6px;border-radius:999px;font:12px/1.2 sans-serif;pointer-events:none;display:none;";
document.body.appendChild(debugBadge);

// Debug log window (only when ?debug=1).
const debugLog = debug ? document.createElement("pre") : null;
const debugLogLines = [];
const debugLogMax = 200;
if (debugLog) {
  debugLog.style.cssText =
    "position:fixed;left:8px;bottom:8px;z-index:9998;" +
    "max-width:min(52vw, 640px);max-height:38vh;overflow:auto;" +
    "background:rgba(8,12,18,0.72);color:#d7e3ff;" +
    "border:1px solid rgba(255,255,255,0.12);border-radius:6px;" +
    "padding:6px 8px;font:11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, \"Liberation Mono\", monospace;" +
    "white-space:pre-wrap;pointer-events:auto;";
  debugLog.textContent = "[debug log]\n";
  document.body.appendChild(debugLog);
}

function vizDebugLog(msg, data){
  if (!debugLog) return;
  const t = (performance.now() / 1000).toFixed(3);
  let line = `[${t}] ${msg}`;
  if (data !== undefined) {
    line += typeof data === "string" ? ` ${data}` : ` ${JSON.stringify(data)}`;
  }
  debugLogLines.push(line);
  if (debugLogLines.length > debugLogMax) {
    debugLogLines.splice(0, debugLogLines.length - debugLogMax);
  }
  debugLog.textContent = debugLogLines.join("\n");
  debugLog.scrollTop = debugLog.scrollHeight;
}
window.__vizDebugLog = debug ? vizDebugLog : null;


let vizErrorInfo = null;

function errorMessage(err){
  if(!err) return "";
  if(typeof err === "string") return err;
  if(err.message) return err.message;
  return String(err);
}

function errorStack(err){
  if(!err || typeof err === "string") return "";
  if(err.stack) return String(err.stack);
  return "";
}

function switchLine(state){
  if(state === "switched") return "Switched to Safe Mode";
  if(state === "already") return "Switched to Safe Mode (already active)";
  if(state === "failed") return "Switched to Safe Mode (failed)";
  if(state === "not-attempted") return "Switched to Safe Mode (not attempted)";
  return "Switched to Safe Mode";
}

function updateErrorPanel(){
  if(!vizErrorPanel) return;
  if(!vizErrorInfo){
    vizErrorPanel.classList.remove("visible");
    return;
  }
  vizErrorPanel.classList.add("visible");
  vizErrorViz.textContent = `${vizErrorInfo.name} (${vizErrorInfo.id})`;
  vizErrorMsg.textContent = vizErrorInfo.message || "(no message)";
  if(vizErrorInfo.stack){
    vizErrorStack.textContent = vizErrorInfo.stack;
    vizErrorStack.style.display = "block";
    vizErrorStackLabel.style.display = "block";
  }else{
    vizErrorStack.textContent = "";
    vizErrorStack.style.display = "none";
    vizErrorStackLabel.style.display = "none";
  }
  vizErrorTime.textContent = vizErrorInfo.time;
  vizErrorSwitch.textContent = switchLine(vizErrorInfo.switchState);
}

function updateErrorBadge(){
  if(!vizError){
    debugBadge.style.display = "none";
    debugBadge.removeAttribute("title");
    return;
  }
  debugBadge.style.display = "block";
  debugBadge.textContent = debug ? "viz error" : "⚠";
  debugBadge.title = vizErrorInfo ? vizErrorInfo.message : errorMessage(vizError);
}

function recordVizError(err, context){
  const id = context?.id || vizName;
  const meta = registry.get(id);
  const name = meta?.name || id;
  const phase = context?.phase || "unknown";
  const switchState = context?.switchState || "not-attempted";
  vizError = err;
  vizErrorInfo = {
    id,
    name,
    phase,
    switchState,
    message: errorMessage(err),
    stack: errorStack(err),
    time: new Date().toISOString(),
  };
  console.error(`Visualizer error [${phase}] ${name} (${id})`, err);
  if (debug && window.__vizDebugLog) {
    window.__vizDebugLog("[viz error]", `${name} (${id}) ${vizErrorInfo.message}`);
  }
  updateErrorBadge();
  updateErrorPanel();
}

function clearVizError(){
  vizError = null;
  vizErrorInfo = null;
  updateErrorBadge();
  updateErrorPanel();
}

let _pendingFallback = false;
let _safeModeFailed = false;

function scheduleSafeModeFallback(){
  if(_pendingFallback) return;
  _pendingFallback = true;
  requestAnimationFrame(()=>{
    _pendingFallback = false;
    if(vizName === SAFE_VIZ_ID) return;
    vizSel.value = SAFE_VIZ_ID;
    void setViz(SAFE_VIZ_ID);
  });
}

window.addEventListener("error", (e)=>{
  const err = e.error || e.message || e;
  const canSwitch = vizName !== SAFE_VIZ_ID && registry.get(SAFE_VIZ_ID);
  recordVizError(err, { id: vizName, phase: "window", switchState: canSwitch ? "switched" : "already" });
  if(canSwitch) scheduleSafeModeFallback();
});

window.addEventListener("unhandledrejection", (e)=>{
  const err = e.reason || e;
  const canSwitch = vizName !== SAFE_VIZ_ID && registry.get(SAFE_VIZ_ID);
  recordVizError(err, { id: vizName, phase: "promise", switchState: canSwitch ? "switched" : "already" });
  if(canSwitch) scheduleSafeModeFallback();
});

function validateVizInstance(instance){
  const missing = [];
  if(!instance || typeof instance.onResize !== "function") missing.push("onResize");
  if(!instance || typeof instance.onFrame !== "function") missing.push("onFrame");
  if(!instance || typeof instance.destroy !== "function") missing.push("destroy");
  if(missing.length){
    throw new Error(`Visualizer missing methods: ${missing.join(", ")}`);
  }
}

async function setViz(name){
  let destroyError = null;
  let destroyFailed = false;
  if(viz && typeof viz.destroy === "function"){
    try{
      viz.destroy();
    }catch(err){
      destroyError = err;
      destroyFailed = true;
      recordVizError(err, { id: vizName, phase: "destroy", switchState: "not-attempted" });
    }
  }

  viz = null;
  vizName = name;
  if(debug) mutationLogged.clear();

  const nextRenderer = (registry.get(name)?.renderer ?? "2d");
  if(destroyFailed || nextRenderer !== currentRenderer || (currentRenderer === "webgl" && nextRenderer === "webgl")){
    replaceCanvas();
  }

  const tryCreate = async (id)=>{
    const instance = await createVisualizer(id, canvas);
    validateVizInstance(instance);
    return instance;
  };

  let err = null;
  if(!registry.get(name)){
    err = new Error(`Unknown visualizer: ${name}`);
  }else{
    try{
      viz = await tryCreate(name);
    }catch(e){
      err = e;
      viz = null;
    }
  }

  if(err){
    const canFallback = name !== SAFE_VIZ_ID && registry.get(SAFE_VIZ_ID);
    recordVizError(err, { id: name, phase: "create", switchState: canFallback ? "switched" : "already" });
    if(canFallback){
      replaceCanvas();
      let fallbackErr = null;
      try{
        viz = await tryCreate(SAFE_VIZ_ID);
      }catch(e){
        fallbackErr = e;
        viz = null;
      }
      if(fallbackErr){
        recordVizError(fallbackErr, { id: SAFE_VIZ_ID, phase: "fallback", switchState: "failed" });
        _safeModeFailed = true;
      }else{
        vizName = SAFE_VIZ_ID;
        if(vizSel.value !== SAFE_VIZ_ID) vizSel.value = SAFE_VIZ_ID;
      }
    }
  }

  if(!viz){
    if(!embed){
      const msg = vizErrorInfo ? vizErrorInfo.message : errorMessage(vizError);
      meta.innerHTML = `Visualizer error: <b>${msg}</b>`;
    }
    return;
  }

  currentRenderer = (registry.get(vizName)?.renderer ?? "2d");

  const allowHistory = location.pathname.startsWith("/v/");
  if(!embed && allowHistory){
    history.replaceState({}, "", `/v/${vizName}${location.search}`);
  }
  resize();
}

async function initViz(){
  if(followServer){
    try{
      const st = await (await fetch("/api/state")).json();
      if(st.visualizer_name && registry.get(st.visualizer_name)){
        vizName = st.visualizer_name;
      }
    }catch(e){}
  }
  vizSel.value = vizName;
  await setViz(vizName);
}

await initViz();

vizSel.addEventListener("change", async ()=>{
  const next = vizSel.value;
  await setViz(next);
  if(followServer && !embed){
    try{
      await fetch("/api/visualizer", {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({visualizer: next}),
      });
    }catch(e){}
  }
});

async function pollState(){
  try{
    const st = await (await fetch("/api/state")).json();
    lastState = { samplerate: st.samplerate || 48000, fft_size: st.fft_size || 2048 };
    if(followServer && st.visualizer_name && st.visualizer_name !== vizName){
      if(registry.get(st.visualizer_name)){
        vizSel.value = st.visualizer_name;
        await setViz(st.visualizer_name);
      }
    }
    if(typeof st.gain === "number"){
      gainEl.value = String(st.gain);
    }
    if(typeof st.visual_smoothing === "number"){
      vsmoothEl.value = String(st.visual_smoothing);
    }
    if(!embed){
      const rms = (st.metrics?.rms||[]).map(x=>x.toFixed(4)).join(",");
      const peak = (st.metrics?.peak||[]).map(x=>x.toFixed(4)).join(",");
      const err = vizError ? ` | visualizer <b style="color:#ff6b6b">error</b>` : "";
      meta.innerHTML = `Status <b>${st.status}</b> | ws <b>${st.ws_clients}</b> | rms <b>${rms}</b> | peak <b>${peak}</b> | fft <b>${st.fft_size}</b> | gain <b>${Number(gainEl.value).toFixed(2)}x</b> | smooth <b>${Number(vsmoothEl.value).toFixed(2)}</b>${err}`;
    }
  }catch(e){}
}
const pollIntervalMs = embed ? 1600 : 800;
setInterval(pollState, pollIntervalMs);
pollState();

connectAudioWS({
  url: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/audio",
  onFrame: (frame)=>{ latestFrame = frame; },
  onError: (err)=>{
    recordVizError(err, { id: vizName, phase: "audio", switchState: "not-attempted" });
  },
});

let lastSpectrum = null;
let lastWave = null;
let lastWaveLR = null;
const EMPTY_F32 = new Float32Array(0);

// Stable, reusable frame object (avoid per-frame allocations).
const frame = {
  frameId: 0,
  ts: 0,
  tsMs: 0,
  channels: 1,
  rms: null,
  peak: null,
  corr: null,
  bass: 0,
  mid: 0,
  high: 0,
  energy: 0,
  overlay: false,
  waveLR: null,
  spectrum: null,
  wave: null,
  gain: 1.0,
  samplerate: 48000,
  fftSize: 2048,
  // Engine timing (seconds): prefer these over ts.
  dt: 1/60,
  t: 0,
  // Viewport (backbuffer pixels)
  width: 0,
  height: 0,
  dpr: 1,
  time: { t: 0, dt: 1/60 },
  viewport: { w: 0, h: 0, dpr: 1 },
};

let __lastAnimNow = performance.now();
let __t = 0;
let __frameId = 0;

function smoothArray(prev, cur, alpha){
  if(!prev || prev.length !== cur.length){
    return cur.slice ? cur.slice() : new Float32Array(cur);
  }
  const out = prev;
  const a = alpha;
  const b = 1 - a;
  for(let i=0;i<cur.length;i++){
    out[i] = a*out[i] + b*cur[i];
  }
  return out;
}

function clamp01(x){
  if(x < 0) return 0;
  if(x > 1) return 1;
  return x;
}

function checksumArray(arr){
  if(!arr || !arr.length) return null;
  const len = arr.length;
  const stride = Math.max(1, Math.floor(len / 64));
  let sum = 0;
  let sumAbs = 0;
  let max = 0;
  for(let i=0;i<len;i+=stride){
    const v = arr[i];
    sum += v;
    const av = Math.abs(v);
    sumAbs += av;
    if(av > max) max = av;
  }
  const q = (x)=> Math.round(x * 1e6);
  return [len, q(sum), q(sumAbs), q(max)];
}

function sameChecksum(a, b){
  if(a === b) return true;
  if(!a || !b) return false;
  return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
}

function reportMutation(which){
  const key = `${vizName}:${which}`;
  if(mutationLogged.has(key)) return;
  mutationLogged.add(key);
  const label = registry.get(vizName)?.name || vizName;
  const msg = `[VizMutation] ${label} (${vizName}) modified input ${which}`;
  recordVizError(msg, { id: vizName, phase: "mutation", switchState: "not-attempted" });
}

function animate(){
  requestAnimationFrame(animate);
  if(!viz) return;
  if(_pendingFallback) return;
  if(_safeModeFailed && vizName === SAFE_VIZ_ID) return;

  const gain = Number(gainEl.value);
  const a60 = Number(vsmoothEl.value);
  const __now = performance.now();
  let __dt = (__now - __lastAnimNow) / 1000;
  __lastAnimNow = __now;
  if(!Number.isFinite(__dt) || __dt <= 0) __dt = 1/60;
  __dt = Math.min(0.1, Math.max(0.0, __dt));
  const alpha = Math.pow(a60, __dt * 60.0);

  const lf = latestFrame;
  const spectrumRaw = (lf && lf.spectrum && lf.spectrum.length)
    ? lf.spectrum
    : EMPTY_F32;
  const waveLR = (lf && lf.timeDomain && lf.timeDomain.length)
    ? lf.timeDomain
    : EMPTY_F32;
  const ch = (lf && Number.isFinite(lf.channels)) ? lf.channels : 1;

  let monoWave;
  if(ch === 1 || waveLR.length < 2){
    monoWave = waveLR;
  }else{
    const n = Math.floor(waveLR.length / 2);
    if(n > 0){
      if(!viz._mono || viz._mono.length !== n) viz._mono = new Float32Array(n);
      const m = viz._mono;
      for(let i=0;i<n;i++){
        m[i] = 0.5*(waveLR[2*i] + waveLR[2*i+1]);
      }
      monoWave = m;
    }else{
      monoWave = EMPTY_F32;
    }
  }

  if(spectrumRaw.length){
    lastSpectrum = smoothArray(lastSpectrum, spectrumRaw, alpha);
  }else{
    lastSpectrum = EMPTY_F32;
  }
  if(monoWave.length){
    lastWave = smoothArray(lastWave, monoWave, alpha);
  }else{
    lastWave = EMPTY_F32;
  }
  if(ch === 2 && waveLR.length){
    lastWaveLR = smoothArray(lastWaveLR, waveLR, alpha);
  }else{
    lastWaveLR = null;
  }

  let bass = 0;
  let mid = 0;
  let high = 0;
  let energy = 0;
  const spectrum = lastSpectrum;
  const specLen = spectrum.length | 0;
  if(specLen > 0){
    const maxBin = specLen - 1;
    // Log-spaced bands over the smoothed spectrum.
    let b1 = Math.max(1, Math.floor(specLen * 0.12));
    let m1 = Math.max(b1 + 1, Math.floor(specLen * 0.40));
    if(maxBin > 1){
      const logMin = Math.log(1);
      const logMax = Math.log(maxBin);
      b1 = Math.max(1, Math.floor(Math.exp(logMin + (logMax - logMin) * 0.33)));
      m1 = Math.max(b1 + 1, Math.floor(Math.exp(logMin + (logMax - logMin) * 0.66)));
    }
    if(b1 > specLen) b1 = specLen;
    if(m1 > specLen) m1 = specLen;
    let sumBass = 0;
    let sumMid = 0;
    let sumHigh = 0;
    let sumAll = 0;
    for(let i=0;i<specLen;i++){
      const v = spectrum[i];
      const sv = Number.isFinite(v) ? v : 0;
      sumAll += sv;
      if(i < b1) sumBass += sv;
      else if(i < m1) sumMid += sv;
      else sumHigh += sv;
    }
    energy = sumAll / specLen;
    if(b1 > 0) bass = sumBass / b1;
    const midCount = m1 - b1;
    if(midCount > 0) mid = sumMid / midCount;
    const highCount = specLen - m1;
    if(highCount > 0) high = sumHigh / highCount;
  }

  // Fill stable frame object
  if(lf && Number.isFinite(lf.frameId)){
    frame.frameId = lf.frameId;
  }else{
    __frameId = (__frameId + 1) | 0;
    frame.frameId = __frameId;
  }
  if(lf && Number.isFinite(lf.ts)){
    frame.ts = lf.ts;
    frame.tsMs = lf.ts < 1e12 ? lf.ts * 1000 : lf.ts;
  }else{
    frame.ts = __t;
    frame.tsMs = __t * 1000;
  }
  frame.channels = ch;
  frame.rms = lf ? lf.rms : null;
  frame.peak = lf ? lf.peak : null;
  frame.corr = lf ? lf.corr : null;
  frame.bass = clamp01(bass);
  frame.mid = clamp01(mid);
  frame.high = clamp01(high);
  frame.energy = clamp01(energy);
  frame.overlay = embed;
  frame.waveLR = lastWaveLR;
  frame.spectrum = lastSpectrum;
  frame.wave = lastWave;
  frame.gain = gain;
  frame.samplerate = lastState.samplerate;
  frame.fftSize = lastState.fft_size;

  frame.dt = __dt;
  __t += __dt;
  frame.t = __t;
  frame.time.t = __t;
  frame.time.dt = __dt;

  const dpr = window.devicePixelRatio || 1;
  frame.dpr = dpr;
  frame.width = canvas.width|0;
  frame.height = canvas.height|0;
  frame.viewport.w = frame.width;
  frame.viewport.h = frame.height;
  frame.viewport.dpr = dpr;

  if(debug){
    const cSpec0 = checksumArray(lastSpectrum);
    const cWave0 = checksumArray(lastWave);
    const cLR0 = checksumArray(lastWaveLR);

    let err = null;
    try{ viz.onFrame(frame); }catch(e){ err = e; }
    if(err){
      const canSwitch = vizName !== SAFE_VIZ_ID && registry.get(SAFE_VIZ_ID);
      recordVizError(err, { id: vizName, phase: "onFrame", switchState: canSwitch ? "switched" : "already" });
      if(canSwitch){
        scheduleSafeModeFallback();
      }else{
        _safeModeFailed = true;
      }
      return;
    }

    const cSpec1 = checksumArray(lastSpectrum);
    const cWave1 = checksumArray(lastWave);
    const cLR1 = checksumArray(lastWaveLR);

    if(!sameChecksum(cSpec0, cSpec1)) reportMutation("spectrum");
    if(!sameChecksum(cWave0, cWave1)) reportMutation("wave");
    if(!sameChecksum(cLR0, cLR1)) reportMutation("waveLR");
  }else{
    try{
      viz.onFrame(frame);
    }catch(e){
      const canSwitch = vizName !== SAFE_VIZ_ID && registry.get(SAFE_VIZ_ID);
      recordVizError(e, { id: vizName, phase: "onFrame", switchState: canSwitch ? "switched" : "already" });
      if(canSwitch){
        scheduleSafeModeFallback();
      }else{
        _safeModeFailed = true;
      }
      return;
    }
  }
}
resize();
animate();
</script>
